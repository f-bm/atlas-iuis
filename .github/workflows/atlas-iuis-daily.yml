name: Atlas IUIS 2024 — Fiche quotidienne & Quiz hebdomadaire

on:
  schedule:
    # Tous les jours à 07h00 UTC (08h00 CET / 09h00 CEST)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test sans écriture Notion (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  daily-iei-fiche:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily fiche & index in Notion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/generate_daily_fiche.py

      - name: Commit updated queue & markdown fiche
        run: |
          git config user.name "atlas-iuis-bot"
          git config user.email "atlas-iuis-bot@users.noreply.github.com"
          git add fiches/ scripts/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Atlas IUIS: Fiche quotidienne $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Aucune modification à committer."
          fi

      - name: Send email notification (optional, if SMTP secrets configured)
        if: env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Atlas IUIS 2024 — Nouvelle fiche disponible"
          to: ${{ secrets.MAIL_TO }}
          from: "Atlas IUIS Bot <${{ secrets.MAIL_USERNAME }}>"
          body: file://fiches/latest_notification.txt
